name: Tag ARM64 Image as Latest

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jeinse/discourse_docker

jobs:
  tag-latest:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ARM64 image
        run: |
          docker pull \
            "${IMAGE_NAME}:release-stable-arm64"

      - name: Tag as latest
        run: |
          docker tag \
            "${IMAGE_NAME}:release-stable-arm64" \
            "${IMAGE_NAME}:latest"

      - name: Push latest
        run: |
          docker push \
            "${IMAGE_NAME}:latest"

      - name: Verify
        run: |
          docker image inspect \
            "${IMAGE_NAME}:latest" \
            --format '{{.Architecture}}/{{.Os}}'